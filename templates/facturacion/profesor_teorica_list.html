{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Profesores de teórica</h2><a class="btn btn-primary" href="{% url 'facturacion:profesor_teorica_create' %}">Nuevo profesor</a></div>
<table class="table"><thead><tr><th>Nombre</th><th>DNI/NIE</th><th></th></tr></thead><tbody>{% for profesor in object_list %}<tr><td>{{ profesor.nombre }}</td><td>{{ profesor.dni }}</td><td><a href="{% url 'facturacion:profesor_teorica_update' profesor.pk %}">Editar</a> <a class="text-danger" href="{% url 'facturacion:profesor_teorica_delete' profesor.pk %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="3" class="text-muted">No hay profesores.</td></tr>{% endfor %}</tbody></table>
{% endblock %}
